name: croc_wallet
description: CrocWallet savings tracker
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  provider: ^6.1.2
  intl: ^0.19.0
  http: ^1.6.0
  url_launcher: ^6.3.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/icons/croc_wallet_launcher.png
  adaptive_icon_background: "#FFFDF7"
  adaptive_icon_foreground: assets/images/icons/croc_wallet_launcher.png
